name: lockitron
description: Lockitron was a smart-lock startup (Bluetooth/Wi-Fi keyless entry, the Lockitron Bolt)
  that offered an open web API at api.lockitron.com and integrations with IFTTT, Pebble, Nest and others.
  It was acquired by Chamberlain Group in 2019 and its service and developer API were shut down on
  2020-06-17; Bolt devices moved to Chamberlain's myQ platform. The company is defunct and its domain
  (lockitron.com) is parked with no live web or API surface. Surfaced as a slow-ventures portfolio lead.
